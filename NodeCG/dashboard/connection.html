<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Connexion Spectra</title>
</head>
<body>
  <div class="stack">
    <div class="grid">
      <div class="card"><div class="label">Transport</div><div id="transport" class="badge">—</div></div>
      <div class="card"><div class="label">Source</div><div id="source" class="badge">—</div></div>
    </div>
    <div class="card stack">
      <div class="row"><span class="label">Profil</span><span id="profile" class="value">—</span></div>
      <div class="row"><span class="label">Socket.IO</span><span id="protocol" class="value">—</span></div>
      <div class="row"><span class="label">Groupe actif</span><span id="group" class="value">—</span></div>
      <div class="row"><span class="label">Dernier paquet</span><span id="packet" class="value">—</span></div>
      <div class="row"><span class="label">Dernier changement</span><span id="change" class="value">—</span></div>
    </div>
    <form id="group-form" class="card stack">
      <label for="group-code" class="label">Changer de groupe/session Spectra</label>
      <input id="group-code" name="group-code" maxlength="64" autocomplete="off" required placeholder="Code fourni par Spectra">
      <button type="submit" class="primary">Connecter ce groupe</button>
      <p class="muted">Le code est envoye seulement a l'extension et n'est jamais publie dans un Replicant. Changer de groupe invalide immediatement l'ancien etat.</p>
    </form>
    <div id="error" class="muted"></div>
    <div id="command-status" class="status-line"></div>
  </div>
  <script src="common.js"></script>
  <script src="connection.js"></script>
</body>
</html>
