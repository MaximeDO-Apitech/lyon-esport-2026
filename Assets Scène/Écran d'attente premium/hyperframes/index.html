<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Gotham LES";
        src: url("./assets/fonts/GothamBlack.otf") format("opentype");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      :root {
        --night: #010a14;
        --white: #fafbfb;
        --cyan: #01f7fd;
        --solar: #fcc766;
        --orange: #ef7b28;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }

      [data-composition-id="lyon-esport-waiting"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: var(--night);
        color: var(--white);
        font-family: "Gotham LES", sans-serif;
      }

      .depth-field {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 50% 38%, rgba(1, 247, 253, 0.07) 0, rgba(1, 247, 253, 0.018) 23%, transparent 52%),
          radial-gradient(circle at 15% 82%, rgba(239, 123, 40, 0.075) 0, transparent 31%),
          radial-gradient(circle at 87% 76%, rgba(1, 247, 253, 0.055) 0, transparent 30%),
          var(--night);
      }

      .technical-grid {
        position: absolute;
        inset: -120px;
        z-index: 1;
        width: calc(100% + 240px);
        height: calc(100% + 240px);
        opacity: 0.28;
      }

      .frame-lines {
        position: absolute;
        inset: 56px;
        z-index: 2;
        border: 1px solid rgba(250, 251, 251, 0.08);
        pointer-events: none;
      }

      .frame-lines::before,
      .frame-lines::after {
        content: "";
        position: absolute;
        top: 28px;
        bottom: 28px;
        width: 2px;
        background: linear-gradient(to bottom, transparent, rgba(1, 247, 253, 0.58), transparent);
      }

      .frame-lines::before { left: -1px; }
      .frame-lines::after { right: -1px; background: linear-gradient(to bottom, transparent, rgba(239, 123, 40, 0.58), transparent); }

      .corner {
        position: absolute;
        z-index: 3;
        width: 94px;
        height: 94px;
        border-color: rgba(250, 251, 251, 0.32);
        border-style: solid;
      }

      .corner.tl { left: 84px; top: 84px; border-width: 2px 0 0 2px; }
      .corner.tr { right: 84px; top: 84px; border-width: 2px 2px 0 0; }
      .corner.bl { left: 84px; bottom: 84px; border-width: 0 0 2px 2px; }
      .corner.br { right: 84px; bottom: 84px; border-width: 0 2px 2px 0; }

      .sweep {
        position: absolute;
        top: -160px;
        bottom: -160px;
        z-index: 3;
        width: 260px;
        opacity: 0;
        transform: skewX(-16deg);
        pointer-events: none;
      }

      .sweep.cyan {
        background: radial-gradient(ellipse at center, rgba(1, 247, 253, 0.16) 0, rgba(1, 247, 253, 0.035) 38%, transparent 72%);
      }

      .sweep.orange {
        background: radial-gradient(ellipse at center, rgba(239, 123, 40, 0.12) 0, rgba(239, 123, 40, 0.028) 38%, transparent 72%);
      }

      .flame-wrap {
        position: absolute;
        left: 50%;
        bottom: -600px;
        z-index: 4;
        width: 2050px;
        height: auto;
        transform: translateX(-50%);
        transform-origin: 50% 80%;
        pointer-events: none;
      }

      .flame-wrap img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .lower-shade {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: radial-gradient(ellipse at 50% 66%, transparent 0, rgba(1, 10, 20, 0.08) 42%, rgba(1, 10, 20, 0.43) 76%, rgba(1, 10, 20, 0.72) 100%);
        pointer-events: none;
      }

      .orbit {
        position: absolute;
        left: 50%;
        top: 39%;
        z-index: 6;
        border: 1px solid rgba(250, 251, 251, 0.08);
        border-radius: 50%;
        pointer-events: none;
        will-change: transform;
      }

      .orbit.one { width: 980px; height: 460px; margin-left: -490px; margin-top: -230px; }
      .orbit.two { width: 1280px; height: 640px; margin-left: -640px; margin-top: -320px; border-color: rgba(1, 247, 253, 0.07); }
      .orbit.three { width: 1530px; height: 820px; margin-left: -765px; margin-top: -410px; border-color: rgba(239, 123, 40, 0.06); }

      .particle {
        position: absolute;
        top: 50%;
        border-radius: 50%;
        box-shadow: 0 0 18px currentColor;
      }

      .particle.cyan { color: var(--cyan); background: var(--cyan); }
      .particle.orange { color: var(--orange); background: var(--orange); }
      .particle.solar { color: var(--solar); background: var(--solar); }
      .orbit.one .particle { left: -5px; width: 10px; height: 10px; }
      .orbit.two .particle { right: -4px; width: 8px; height: 8px; }
      .orbit.three .particle { left: 20%; width: 6px; height: 6px; }

      .logo-halo {
        position: absolute;
        left: 50%;
        top: 44px;
        z-index: 7;
        width: 660px;
        height: 500px;
        margin-left: -330px;
        border-radius: 50%;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .logo-halo.cyan { background: radial-gradient(ellipse at center, rgba(1, 247, 253, 0.13) 0, rgba(1, 247, 253, 0.028) 41%, transparent 70%); }
      .logo-halo.orange { background: radial-gradient(ellipse at center, rgba(239, 123, 40, 0.08) 0, transparent 68%); }

      .scene-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        height: 100%;
        padding: 76px 170px 88px;
        gap: 0;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 430px;
        height: 344px;
      }

      .brand-lockup img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      .message-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-top: 26px;
      }

      .message-kicker {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin-bottom: 20px;
        color: var(--solar);
        font-size: 18px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .message-kicker::before,
      .message-kicker::after {
        content: "";
        width: 74px;
        height: 2px;
        background: currentColor;
      }

      h1 {
        margin: 0;
        max-width: 1500px;
        color: var(--white);
        font-family: "Gotham LES", sans-serif;
        font-size: 78px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.018em;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 0 34px rgba(1, 247, 253, 0.085);
        white-space: nowrap;
      }

      .countdown-zone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 590px;
        height: 126px;
        margin-top: 38px;
        background: rgba(1, 10, 20, 0.68);
        border: 1px solid rgba(250, 251, 251, 0.23);
        box-shadow: inset 0 0 0 1px rgba(1, 247, 253, 0.035), 0 18px 60px rgba(1, 10, 20, 0.45);
      }

      .countdown-zone::before,
      .countdown-zone::after {
        content: "";
        position: absolute;
        top: -1px;
        width: 116px;
        height: 2px;
      }

      .countdown-zone::before { left: 0; background: var(--cyan); }
      .countdown-zone::after { right: 0; background: var(--orange); }

      .countdown-label {
        color: var(--solar);
        font-size: 16px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .countdown-safe-area {
        width: 500px;
        height: 64px;
        margin-top: 10px;
        border-right: 1px solid rgba(1, 247, 253, 0.34);
        border-left: 1px solid rgba(239, 123, 40, 0.34);
      }

      .status-left,
      .status-right {
        position: absolute;
        bottom: 102px;
        z-index: 9;
        color: rgba(250, 251, 251, 0.62);
        font-family: "Gotham LES", sans-serif;
        font-size: 14px;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .status-left { left: 118px; }
      .status-right { right: 118px; text-align: right; }
      .status-dot { color: var(--cyan); margin-right: 12px; }
    </style>
  </head>
  <body>
    <main
      id="waiting-loop"
      data-composition-id="lyon-esport-waiting"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div class="depth-field" data-layout-ignore></div>

      <svg class="technical-grid" id="technical-grid" viewBox="0 0 2160 1320" aria-hidden="true" data-layout-ignore>
        <defs>
          <pattern id="smallGrid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FAFBFB" stroke-opacity="0.08" stroke-width="1" />
          </pattern>
          <pattern id="largeGrid" width="240" height="240" patternUnits="userSpaceOnUse">
            <rect width="240" height="240" fill="url(#smallGrid)" />
            <path d="M 240 0 L 0 0 0 240" fill="none" stroke="#01F7FD" stroke-opacity="0.13" stroke-width="1" />
          </pattern>
          <linearGradient id="lineCyan" x1="0" x2="1">
            <stop offset="0" stop-color="#01F7FD" stop-opacity="0" />
            <stop offset="0.5" stop-color="#01F7FD" stop-opacity="0.48" />
            <stop offset="1" stop-color="#01F7FD" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="lineOrange" x1="0" x2="1">
            <stop offset="0" stop-color="#EF7B28" stop-opacity="0" />
            <stop offset="0.5" stop-color="#EF7B28" stop-opacity="0.42" />
            <stop offset="1" stop-color="#EF7B28" stop-opacity="0" />
          </linearGradient>
        </defs>
        <rect width="2160" height="1320" fill="url(#largeGrid)" />
        <path d="M0 260 H2160" stroke="url(#lineCyan)" stroke-width="2" />
        <path d="M0 1010 H2160" stroke="url(#lineOrange)" stroke-width="2" />
        <path d="M290 0 V1320 M1870 0 V1320" stroke="#FAFBFB" stroke-opacity="0.07" stroke-width="1" />
      </svg>

      <div class="frame-lines" data-layout-ignore></div>
      <div class="corner tl" data-layout-ignore></div>
      <div class="corner tr" data-layout-ignore></div>
      <div class="corner bl" data-layout-ignore></div>
      <div class="corner br" data-layout-ignore></div>
      <div class="sweep cyan" id="sweep-cyan" data-layout-ignore></div>
      <div class="sweep orange" id="sweep-orange" data-layout-ignore></div>

      <div class="flame-wrap" id="flame-wrap" data-layout-allow-overflow>
        <img src="./assets/brand/flamme-officielle-01.png" alt="" />
      </div>
      <div class="lower-shade" data-layout-ignore></div>

      <div class="orbit one" id="orbit-one" data-layout-ignore><span class="particle cyan"></span></div>
      <div class="orbit two" id="orbit-two" data-layout-ignore><span class="particle orange"></span></div>
      <div class="orbit three" id="orbit-three" data-layout-ignore><span class="particle solar"></span></div>

      <div class="logo-halo cyan" id="halo-cyan" data-layout-ignore></div>
      <div class="logo-halo orange" id="halo-orange" data-layout-ignore></div>

      <div class="scene-content">
        <div class="brand-lockup">
          <img src="./assets/brand/logo-lyon-esport-officiel.png" alt="Lyon e-Sport" />
        </div>
        <section class="message-group" aria-label="Message d'attente">
          <div class="message-kicker">Lyon e-Sport 2026</div>
          <h1>Le live commence bientôt</h1>
          <div class="countdown-zone" aria-label="Zone réservée au compte à rebours">
            <div class="countdown-label">Compte à rebours</div>
            <div class="countdown-safe-area"></div>
          </div>
        </section>
      </div>

      <div class="status-left"><span class="status-dot">●</span>Signal prêt</div>
      <div class="status-right">13–15 novembre 2026</div>
    </main>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Every ambient cycle lands on its exact initial state at 12s.
      tl.fromTo("#technical-grid", { x: 0 }, { x: -240, duration: 12, ease: "none" }, 0);
      tl.fromTo("#orbit-one", { rotation: 0 }, { rotation: 360, duration: 12, ease: "none" }, 0);
      tl.fromTo("#orbit-two", { rotation: 0 }, { rotation: -720, duration: 12, ease: "none" }, 0);
      tl.fromTo("#orbit-three", { rotation: 0 }, { rotation: 360, duration: 12, ease: "none" }, 0);

      tl.fromTo("#sweep-cyan", { x: -520 }, { x: 2240, duration: 12, ease: "sine.inOut" }, 0);
      tl.to("#sweep-cyan", { opacity: 0.72, duration: 2.4, ease: "sine.inOut" }, 2.0);
      tl.to("#sweep-cyan", { opacity: 0, duration: 2.4, ease: "sine.inOut" }, 6.6);

      tl.fromTo("#sweep-orange", { x: -760 }, { x: 2180, duration: 12, ease: "sine.inOut" }, 0);
      tl.to("#sweep-orange", { opacity: 0.58, duration: 2.1, ease: "power1.inOut" }, 5.0);
      tl.to("#sweep-orange", { opacity: 0, duration: 2.1, ease: "power1.inOut" }, 8.9);

      tl.to("#halo-cyan", { scale: 1.045, opacity: 0.84, duration: 6, ease: "sine.inOut" }, 0);
      tl.to("#halo-cyan", { scale: 1, opacity: 1, duration: 6, ease: "sine.inOut" }, 6);
      tl.to("#halo-orange", { scale: 0.97, opacity: 0.72, duration: 6, ease: "power1.inOut" }, 0);
      tl.to("#halo-orange", { scale: 1, opacity: 1, duration: 6, ease: "power1.inOut" }, 6);

      tl.to("#flame-wrap", { y: -12, duration: 6, ease: "sine.inOut" }, 0);
      tl.to("#flame-wrap", { y: 0, duration: 6, ease: "sine.inOut" }, 6);

      window.__timelines["lyon-esport-waiting"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
